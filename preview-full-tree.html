<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04070f" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>" />
<title>给她的圣诞树</title>

<style>
/* ============================================================
   1. 设计变量
   全站的"颜色 / 字体 / 间距"都集中在这里。
   想整体换一种感觉，先改这里，而不是去改某一条具体样式。
   ============================================================ */
:root{
  /* 夜空，从最暗到稍亮，用来做渐变 */
  --night-0:#04070f;
  --night-1:#071223;
  --night-2:#0c1c30;

  /* 文字 */
  --ink:#efe9db;
  --muted:rgba(239,233,219,.55);

  /* 唯一的强调色：暖金。只用在"她"和之后的关键动作上 */
  --gold:#f0cb82;

  /* 树的绿，三档明度 */
  --pine-1:#2e6750;
  --pine-2:#17402f;
  --pine-3:#08211a;

  /* 字体：衬线负责情绪，无衬线负责功能 */
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;

  /* 间距与字号随屏幕宽度轻微缩放：clamp(最小值, 视口比例, 最大值) */
  --pad:clamp(20px, 4vw, 56px);
  --title:clamp(26px, 4.4vw, 46px);

  --ease:cubic-bezier(.22,1,.36,1);
}

/* ============================================================
   2. 基础重置
   浏览器自带边距不一致，先统一，再自己定义
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  height:100vh;
  height:100dvh;                 /* 手机上跟随地址栏收起，避免被裁掉 */
  overflow:hidden;
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;

  /* 三层背景叠在一起：地平线暖光 + 右上微光 + 夜空渐变 */
  background:
    radial-gradient(120% 80% at 50% 118%, #16334d 0%, rgba(14,40,62,0) 60%),
    radial-gradient(70% 50% at 82% 6%, rgba(58,86,130,.45), transparent 70%),
    linear-gradient(180deg, var(--night-0) 0%, var(--night-1) 46%, var(--night-2) 100%);

  /* 三行布局：标题 / 舞台 / 底部提示 */
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}
p{margin:0}

/* ============================================================
   3. 背景层：月亮、星星、雪丘、落雪
   全部 aria-hidden，是纯装饰，屏幕阅读器不需要读
   ============================================================ */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.moon{
  position:absolute;
  top:17%;right:14%;
  width:52px;height:52px;
  border-radius:50%;
  background:radial-gradient(circle at 36% 34%, #fffdf3, #ffeecb 55%, #f3d7a4 72%, rgba(243,215,164,0) 74%);
  box-shadow:0 0 40px 12px rgba(255,238,205,.10), 0 0 140px 60px rgba(190,215,255,.05);
  opacity:.85;
}

.star{
  position:absolute;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px 1px rgba(255,255,255,.55);
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.15;transform:scale(.8)}
  50%    {opacity:.9; transform:scale(1)}
}

/* 雪丘：一条 SVG 横跨底部，用两层不同明度的蓝造出远近 */
.hills{
  position:fixed;
  left:0;bottom:0;
  width:100%;height:38vh;
  z-index:1;
  pointer-events:none;
}

#snow{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
}

/* ============================================================
   4. 标题区
   ============================================================ */
.top{
  position:relative;
  z-index:4;
  padding:clamp(16px, 3vh, 30px) var(--pad) 0;
  text-align:center;
}
.eyebrow{
  font-size:10px;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--muted);
}
h1{
  margin:14px 0 0;
  font-family:var(--serif);
  font-weight:500;
  font-size:var(--title);
  letter-spacing:.10em;
  line-height:1.3;
}
h1 em{
  font-style:normal;
  color:var(--gold);
  text-shadow:0 0 26px rgba(240,203,130,.38);
}
.lede{
  margin:14px auto 0;
  max-width:30em;
  font-size:13px;
  line-height:1.9;
  letter-spacing:.06em;
  color:var(--muted);
}

/* 入场：先透明、下移一点，再回到原位。用不同的延迟造出先后顺序 */
.top > *{animation:rise 1s var(--ease) both}
.top > *:nth-child(2){animation-delay:.1s}
.top > *:nth-child(3){animation-delay:.22s}
@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to  {opacity:1;transform:none}
}

/* ============================================================
   5. 舞台：树的容器
   .stage 的宽高由脚本计算，保证它和 SVG 的 600:860 完全一致。
   为什么不用纯 CSS？因为"同时受宽和高两个限制"的等比缩放，
   用几行 JS 比写一堆 clamp 更直观、也更好懂。
   ============================================================ */
.scene{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;                 /* 关键：允许这一行被压缩，树才不会溢出屏幕 */
}
.stage{
  position:relative;
  flex:0 0 auto;
  animation:stageIn 1.4s var(--ease) both;
}
@keyframes stageIn{
  from{opacity:0;transform:scale(.97)}
  to  {opacity:1;transform:none}
}
.tree{display:block;
  width:100%;
  height:100%;
  overflow:visible;
  transform:scaleX(1.5);}

/* ============================================================
   6. 底部提示
   ============================================================ */
.bottom{
  position:relative;
  z-index:4;
  padding:0 var(--pad) clamp(12px, 2vh, 22px);
  text-align:center;
}
.hint{
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-size:11px;
  letter-spacing:.2em;
  color:var(--muted);
}
.dot{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 10px 2px rgba(240,203,130,.45);
  animation:twinkle 3.2s ease-in-out infinite;
}

/* ============================================================
   7. 小屏微调
   ============================================================ */
@media (max-width:560px){
  /* 手机上标题几乎占满一行，月亮必须让位，否则会压字 */
  .moon{width:28px;height:28px;right:8%;top:19%;opacity:.45}
  .lede{font-size:12px;letter-spacing:.04em}
}

/* 尊重系统的"减少动态效果"设置 */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}

.decorate-button{
  display:block;
  margin:18px auto 0;
  padding:12px 28px;
  background:#f0cb82;
  color:#172b22;
  border:none;
  border-radius:999px;
  font-size:15px;
  font-family:inherit;
  cursor:pointer;
}
/* 装饰选择窗口：dialog 自带弹窗语义与 Esc 关闭行为。 */
.ornament-dialog{width:min(90vw,420px);max-height:85vh;overflow:auto;background:#10261f;color:var(--ink);border:1px solid #f0cb8255;border-radius:24px;padding:28px;box-shadow:0 24px 80px #0008}
.ornament-dialog::backdrop{background:#020908aa}
.ornament-dialog h2{margin:0 0 12px;font-size:22px}
.ornament-dialog p{line-height:1.7;color:var(--muted)}
.ornament-options{display:flex;gap:12px;margin:22px 0}
.ornament-option{flex:1;padding:12px 4px;background:#ffffff08;border:1px solid #f0cb8244;border-radius:16px;color:var(--ink);cursor:pointer;font:inherit}
.ornament-option svg{display:block;width:60px;height:72px;margin:auto}
.ornament-option[aria-pressed="true"]{border-color:var(--gold);background:#f0cb8222}
/* 弹窗内两个按钮采用相同的宽度、居中方式和上下间距。 */
.ornament-dialog .decorate-button,
.ornament-dialog .dialog-close{
  display:block;
  width:min(100%,260px);
  margin:16px auto 0;
  min-height:44px;
  text-align:center;
}
.dialog-close{background:transparent;color:var(--gold);border:1px solid #f0cb8266;border-radius:20px;padding:8px 18px;font:inherit;cursor:pointer}
.hang-point{visibility:hidden;pointer-events:none;position:absolute;width:32px;height:32px;padding:0;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer}
.stage.choosing-point .hang-point{visibility:visible;pointer-events:auto}
.hang-point::after{content:"";display:block;width:9px;height:9px;margin:auto;border:1px solid #f0cb82aa;border-radius:50%;background:#f0cb8222}
.hang-point.selected::after{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.hang-point:focus-visible,.ornament-option:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.message-field{display:block;margin:14px 0;color:var(--ink)}
.message-field input,.message-field textarea{display:block;box-sizing:border-box;width:100%;margin-top:8px;padding:12px;border:1px solid #f0cb8255;border-radius:10px;background:#071810;color:var(--ink);font:inherit}
.message-field textarea{min-height:100px;resize:vertical}
.hang-point.occupied{visibility:visible;pointer-events:auto;width:40px;height:50px}
.hang-point.occupied::after{display:none}
.hang-point.occupied svg{width:100%;height:100%;overflow:visible}
#message-content{white-space:pre-wrap;overflow-wrap:anywhere}
.tree-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
[hidden]{display:none!important}
.decorate-button:disabled{opacity:.6;cursor:wait}
.hint{letter-spacing:.04em;line-height:1.6}
.bottom{max-height:34dvh;overflow:auto}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 78% 24%,#a5c5d416,transparent 42%),radial-gradient(ellipse at 26% 46%,#608d8730,transparent 55%)}
.sky::after{content:"";position:absolute;width:90vw;height:25vh;left:-20vw;top:31%;border-radius:50%;background:#93c9bf09;filter:blur(45px);transform:rotate(-16deg)}
.forest{position:fixed;bottom:0;left:0;width:100%;height:47vh;z-index:1;pointer-events:none}
.moon{box-shadow:0 0 0 12px #fff4da03,0 0 0 35px #fff4da02,0 0 100px 30px #c8dde51c}
.hills{height:30vh;opacity:.85}
/* 手机布局：保留树的可操作尺寸，空间不足时允许整页滚动。 */
@media (max-width:600px), (max-height:500px) and (pointer:coarse){
  html{height:auto;min-height:100%}
  body{height:auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;
    grid-template-rows:auto minmax(390px,1fr) auto;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .top{padding:calc(20px + env(safe-area-inset-top)) 20px 0}
  .eyebrow{font-size:9px;letter-spacing:.24em}
  h1{font-size:clamp(24px,6.5vw,34px);letter-spacing:.035em;line-height:1.35;
    margin-top:12px;overflow-wrap:anywhere}
  .lede{font-size:12px;line-height:1.7;margin-top:10px;max-width:26em}
  .scene{min-height:390px;margin:12px 0 6px}
  .bottom{max-height:none;overflow:visible;padding:4px 18px calc(18px + env(safe-area-inset-bottom))}
  .hint{font-size:12px;max-width:100%;justify-content:center;letter-spacing:0;line-height:1.6}
  .dot{flex-shrink:0}
  .bottom > .decorate-button{width:min(100%,320px);min-height:48px;margin-top:14px}
  .tree-actions{gap:8px;margin-top:10px}
  .tree-actions .dialog-close{min-height:44px;font-size:13px;padding:10px 14px}
  .tree-actions .decorate-button{width:min(100%,320px);min-height:48px;margin-top:10px}
  .moon{width:32px;height:32px;top:20%;right:7%;opacity:.55}
  .forest{height:32vh}
  .ornament-dialog{width:calc(100% - 28px);max-width:420px;max-height:calc(100dvh - 32px);
    padding:24px 20px;border-radius:20px;overscroll-behavior:contain;scroll-padding:20px}
  .ornament-dialog h2{font-size:21px;overflow-wrap:anywhere}
  .ornament-dialog p{font-size:14px}
  .message-field input,.message-field textarea{font-size:16px} /* iPhone 聚焦时不自动放大 */
  .ornament-options{gap:8px;margin:18px 0}
  .ornament-option{min-width:0;font-size:13px;min-height:110px}
  .ornament-option svg{width:52px;height:66px;max-width:100%}
  .ornament-dialog button{touch-action:manipulation}
  .hang-point{width:34px;height:34px;touch-action:manipulation}
  .hang-point.occupied{width:34px;height:44px}
}
@media (max-width:360px){
  .top{padding-left:14px;padding-right:14px}
  .ornament-dialog{padding:22px 16px}
  .tree-actions .dialog-close{font-size:12px;padding-inline:12px}
}
@media (max-height:500px) and (orientation:landscape){
  body{height:auto;min-height:100dvh;overflow-y:auto;grid-template-rows:auto 360px auto}
  .scene{min-height:360px}
  .top{padding-top:12px}
  .ornament-dialog{max-height:calc(100dvh - 24px)}
}
@media (max-width:600px){
  .ornament-options:has([data-exclusive]:not([hidden])){display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
.ornament-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ornament-option{min-width:0;font-size:13px}
.hang-point.occupied{width:34px;height:43px;filter:drop-shadow(0 3px 3px #0005)}
@media(max-width:600px){.hang-point.occupied{width:28px;height:36px}.ornament-options:has([data-exclusive]:not([hidden])){grid-template-columns:repeat(3,minmax(0,1fr))}}
.gift-sender{position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);display:block;width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-family:var(--sans);font-size:10px;font-weight:400;line-height:14px;letter-spacing:0;color:#efe9dbbf;text-shadow:0 1px 4px #020b08,0 0 6px #020b08;pointer-events:none}
.hang-point.occupied{overflow:visible}
@media(max-width:600px){.gift-sender{width:46px;font-size:9px;line-height:12px;top:100%}}
</style>

<script>
/* ============================================================
   8. 让舞台精准装进剩余空间
   规则：舞台保持 600:860 的宽高比，并取"宽度受限"和"高度受限"
   中较小的那个，因此无论窗口怎么变，树都完整可见。
   ============================================================ */
const scene = document.querySelector('.scene');
const stage = document.getElementById('stage');
const RATIO = 600 / 860;

function fitStage(){
  const box = scene.getBoundingClientRect();
  // 横向拉宽后的树也要完整放进屏幕。
  const w = Math.max(0, Math.min((box.width - 24) / 1.5, box.height * RATIO));
  stage.style.width  = w + 'px';
  stage.style.height = w / RATIO + 'px';
}
fitStage();
window.addEventListener('resize', fitStage);
new ResizeObserver(fitStage).observe(scene);

/* ============================================================
   9. 星空：用循环生成 60 颗位置随机的星
   注意随机值只决定"长相"，不影响内容，所以每次刷新略有不同是合理的
   ============================================================ */
(function makeStars(){
  const layer = document.getElementById('stars');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 60; i++){
    const s = document.createElement('span');
    s.className = 'star';
    const size = Math.random() * 1.6 + 0.8;
    s.style.cssText = `
      left:${Math.random() * 100}%;
      top:${Math.random() * 68}%;
      width:${size}px; height:${size}px;
      opacity:${(Math.random() * .6 + .25).toFixed(2)};
      animation-delay:${(Math.random() * 4).toFixed(2)}s;
      animation-duration:${(3 + Math.random() * 4).toFixed(2)}s;
    `;
    frag.appendChild(s);
  }
  layer.appendChild(frag);
})();

/* ============================================================
   10. 落雪：canvas 逐帧绘制
   每一片雪都有自己的半径、下落速度、左右漂移和相位，
   这样它们不会整齐划一地落下。
   ============================================================ */
(function snowfall(){
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, flakes = [], t = 0;

  function makeFlake(initial){
    const r = Math.random() * 1.9 + 0.7;
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -10,
      r,
      v: r * 0.5 + 0.25,
      drift: (Math.random() - .5) * .4,
      phase: Math.random() * Math.PI * 2,
      alpha: .2 + Math.random() * .55
    };
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({ length: Math.round(W / 15) }, () => makeFlake(true));
    if (reduce) draw();
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#eaf4ff';
    for (const f of flakes){
      ctx.globalAlpha = f.alpha;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function loop(){
    t += .012;
    for (const f of flakes){
      f.y += f.v;
      f.x += Math.sin(t + f.phase) * f.drift;
      if (f.y > H + 10){ f.y = -10; f.x = Math.random() * W; }
      if (f.x < -10) f.x = W + 10;
      if (f.x > W + 10) f.x = -10;
    }
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);
  if (!reduce) requestAnimationFrame(loop);
})();

</script>

const demoRows=[[23,47,53,2],[30,44,56,3],[39,40,60,4],[48,35,65,5],[58,31,69,5],[68,26,74,6],[78,25,75,6],[88,18,82,7]];

for(const [row,[y,left,right,count]] of demoRows.entries()){for(let i=0;i<count;i++){

 const x=left+(right-left)*i/(count-1)+Math.sin(row*2.4+i*1.9)*1.6;ornament.style.left=`${50+(x-50)*1.5}%`;ornament.style.top=`${y+Math.sin(i*2.3+row*1.7)*2.6}%`;
