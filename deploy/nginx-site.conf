# 放到宝塔已经绑定域名、配置 SSL 的站点 server {} 内。
# 保留宝塔现有证书、域名和 ACME 校验配置，删除冲突的 location / 与旧反向代理。
client_max_body_size 8k;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 15s;
limit_conn tree_per_ip 10;
limit_conn tree_total 60;
limit_conn_status 429;
limit_req_status 429;
gzip on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript;

# 禁止直读源码/数据库，所有请求都到白名单路由应用。
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;
}
location = /api/trees {
    limit_req zone=tree_create burst=3 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_request_buffering on;
}
location /api/ {
    limit_req zone=tree_api burst=15 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_request_buffering on;
}

# BGM 由 Nginx 直接读取，避免长音频下载占用 Python 线程。
# 若项目目录不同，修改 alias 为音乐文件的绝对路径。
location = /assets/music/snowfall.mp3 {
    alias /www/wwwroot/christmas/assets/music/snowfall.mp3;
    default_type audio/mpeg;
    expires 1d;
    add_header X-Content-Type-Options nosniff;
}
