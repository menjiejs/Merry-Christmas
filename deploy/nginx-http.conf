# 宝塔 Nginx 主配置的 http {} 内加入一次；不能放进站点 server {}。
# 针对 API 的限速，不把 HTML/JS 请求算作提交。
limit_req_zone $binary_remote_addr zone=tree_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tree_create:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=tree_per_ip:10m;
limit_conn_zone $server_name zone=tree_total:1m;
